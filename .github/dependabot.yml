version: 2
updates:
  - package-ecosystem: pip
    directory: /Dockerfiles/python/scripts
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /Dockerfiles/db
      - /Dockerfiles/git
      - /Dockerfiles/python
    schedule:
      interval: monthly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
